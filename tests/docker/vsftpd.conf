# Minimal vsftpd config for the host-test harness.
#
# Layout modeled on delfer/docker-alpine-ftp-server with the
# project-specific bits trimmed. The non-obvious entries:
#
#  - `seccomp_sandbox=NO` — alpine's vsftpd package defaults to
#    enabling the seccomp filter, which blocks several syscalls
#    the child needs (notably setgroups / setresuid) when run
#    under Docker. Without this, every login attempt ends with
#    "500 OOPS: child died". See:
#    https://github.com/delfer/docker-alpine-ftp-server
#  - `background=YES` — vsftpd in standalone mode would otherwise
#    stay attached to its parent's stdin/stdout and block the
#    entrypoint script forever (it never exits while serving).
#  - `vsftpd_log_file=/var/log/vsftpd.log` — separate log file so
#    failures (like a missing PAM service) are visible without a
#    syslogd daemon.
#  - `connect_from_port_20=YES` — match what FTP clients expect
#    in active mode. Tests use passive exclusively via the host-
#    mapped 40000-40009 range.

anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022
dirmessage_enable=YES
xferlog_enable=YES
connect_from_port_20=YES
ftpd_banner=Welcome to the Sandstone CLI host-test harness FTP.
listen=YES
listen_ipv6=NO
# Rootless podman can't forward to containers listening on
# privileged ports (<1024) without NET_BIND_SERVICE. Bind on a
# high port inside the container so the host→container
# port-forward works in plain rootless setups. 8235 picked
# because 2121 had unreliable port-forwarding in this podman
# environment.
listen_port=8235
background=YES
seccomp_sandbox=NO
vsftpd_log_file=/var/log/vsftpd.log

# Match the host-mapped passive port range in docker-compose.yml.
# vsftpd needs explicit min/max to advertise its passive data port.
pasv_enable=YES
pasv_addr_resolve=YES
pasv_min_port=40000
pasv_max_port=40009